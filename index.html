<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="author" content="Đàm Mạnh Hiếu" />
    <meta name="theme-color" content="#172326" />
    <meta
      name="description"

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

      <div id="app">

          <div

              position: absolute;
              inset: 0;
              display: grid;
              place-items: center;
              background: #172326;
              color: #efbd69;
              font: 600 18px Arial;
              letter-spacing: 4px;
            "

            ĐANG CHUẨN BỊ CHIẾN TRƯỜNG…

    <script type="module" src="/src/main.js"></script>
